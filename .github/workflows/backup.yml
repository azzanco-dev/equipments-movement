# Daily backup of the production data to the company Google Drive
# (owner 2026-11-19: «Google Drive», «حساب الشركة، وبدون تشفير», and, told
# that this repository is PUBLIC, «نفس المستودع»).
#
# What it copies, read only:
#   * the database: roles, schema and data (`supabase db dump`, the way the
#     Supabase restore guide expects), gzipped, into
#     database/daily/<Saudi day>/ — kept 31 days — and, on the first day of
#     each Saudi month, also into database/monthly/<YYYY-MM>/ — kept a year;
#   * every Storage bucket (movement photos, party documents, any later one)
#     into files/<bucket>/, NEW files only (`rclone copy --ignore-existing`):
#     a file deleted in the program stays in the backup. Nothing under files/
#     is ever deleted by this job.
#
# THIS REPOSITORY IS PUBLIC, so its Actions logs are public. The rules that
# keep the data out of them:
#   * no checkout, no artifact, no cache: the dump exists only on the runner
#     and in Drive;
#   * every value comes from a secret (masked in the logs); rclone runs with
#     -q (errors only) and no file listing; the dump output is never printed;
#   * no pull_request trigger: only the schedule and a manual run, which only
#     people with write access can start;
#   * the token holds the Drive scope drive.file: it reaches only the files
#     this job created, not the rest of the company Drive.
#
# Secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL              the Session pooler connection string, with the
#                                database password (GitHub runners have no IPv6,
#                                the direct connection is IPv6 only)
#   SUPABASE_S3_ACCESS_KEY_ID    a Storage S3 access key (Storage > Settings >
#   SUPABASE_S3_SECRET_ACCESS_KEY  S3 connection); it reads and writes Storage,
#                                this job only reads
#   GDRIVE_TOKEN                 the JSON printed by
#                                rclone authorize "drive" "eyJzY29wZSI6ImRyaXZlLmZpbGUifQ"
#                                (unpadded base64 of {"scope":"drive.file"}) on the
#                                owner's computer, signed in to the company
#                                Google account
#
# A failed run sends GitHub's usual failure e-mail to the repository owner.
# Restore: AGENTS.md, «Backups».

name: Backup

on:
  schedule:
    # 00:00 UTC = 03:00 Saudi time. GitHub may start it some minutes late.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DRIVE_ROOT: 'gdrive:Equipment Movement Backup'
      # Google Drive, by the token of the company account (scope drive.file).
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
      # Supabase Storage through its S3 protocol. The project ref and region
      # are not secret (the ref is in the app's public Supabase URL).
      RCLONE_CONFIG_SUPABASE_TYPE: s3
      RCLONE_CONFIG_SUPABASE_PROVIDER: Other
      RCLONE_CONFIG_SUPABASE_ENDPOINT: https://rkxlkqpwwkbudzldbbsn.storage.supabase.co/storage/v1/s3
      RCLONE_CONFIG_SUPABASE_REGION: ap-south-1
      RCLONE_CONFIG_SUPABASE_FORCE_PATH_STYLE: 'true'
      RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      RCLONE_STATS: '0'
    steps:
      - name: Check the secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          S3_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          S3_SECRET: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          missing=0
          for name in SUPABASE_DB_URL S3_KEY S3_SECRET GDRIVE_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name"; missing=1; fi
          done
          exit "$missing"

      - name: Install the tools
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq rclone >/dev/null
          rclone version | head -1

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/db"
          cd "$RUNNER_TEMP/db"
          supabase db dump --remote="$SUPABASE_DB_URL" -f roles.sql --role-only >/dev/null
          supabase db dump --remote="$SUPABASE_DB_URL" -f schema.sql >/dev/null
          supabase db dump --remote="$SUPABASE_DB_URL" -f data.sql --use-copy --data-only \
            -x "storage.buckets_vectors" -x "storage.vectors" >/dev/null
          # A dump that lost the movements is not a backup.
          grep -q '^COPY "public"."entry_exit_logs"\|^COPY public.entry_exit_logs' data.sql \
            || { echo "The data dump has no movements"; exit 1; }
          grep -q 'CREATE TABLE' schema.sql || { echo "The schema dump is empty"; exit 1; }
          gzip -9 roles.sql schema.sql data.sql
          gzip -t roles.sql.gz schema.sql.gz data.sql.gz
          du -h -- *.sql.gz | awk '{ print "dump " $2 ": " $1 }'

      - name: Upload the database dump
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Riyadh date +%F)"
          rclone copy -q "$RUNNER_TEMP/db" "$DRIVE_ROOT/database/daily/$day"
          if [ "$(TZ=Asia/Riyadh date +%d)" = "01" ]; then
            rclone copy -q "$RUNNER_TEMP/db" "$DRIVE_ROOT/database/monthly/$(TZ=Asia/Riyadh date +%Y-%m)"
          fi
          # Only the dated dump folders age out; files/ is never touched.
          rclone delete -q --min-age 31d "$DRIVE_ROOT/database/daily"
          rclone rmdirs -q --leave-root "$DRIVE_ROOT/database/daily"
          rclone delete -q --min-age 370d "$DRIVE_ROOT/database/monthly"
          rclone rmdirs -q --leave-root "$DRIVE_ROOT/database/monthly"
          echo "database uploaded: $day"

      - name: Copy the new Storage files
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r bucket; do
            bucket="${bucket%/}"
            [ -n "$bucket" ] || continue
            rclone copy -q --ignore-existing --transfers 4 \
              "supabase:$bucket" "$DRIVE_ROOT/files/$bucket"
            count=$((count + 1))
          done < <(rclone lsf -q --dirs-only "supabase:")
          [ "$count" -gt 0 ] || { echo "No Storage bucket was listed"; exit 1; }
          echo "buckets copied: $count"
